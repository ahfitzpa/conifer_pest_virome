# configs/phylogenetics.yaml
# Inputs and parameters for rules/09.phylogenetics.smk (Phase 3).
# Paths are relative to the workflow directory unless absolute.

phylogenetics:
# Phase 2 inputs are read from .. (the conifer_pest_virome root, where phase2 runs) -- phase3 is a separate workflow
# with its own working directory, so these are relative to conifer_pest_virome/phase3.
  # ICTV reference proteins, produced from VMR MSL41.v1. Headers carry
  # |<family>| so the prepare script can select exemplars per family.
  # Built by submit_fetch_refs.sh for every family this pathway analyses.
  # The previous ictv_refs.faa held only Chuviridae and Dicistroviridae,
  # hardcoded in the old fetch_refs.py, so almost every family was treed
  # with no references and demarcation had nothing to compare against.
  ictv_proteins: "../references/ictv_refs_all.faa"
  ictv_metadata: "../references/ictv_refs_all_meta.tsv"
  vmr_release: "MSL41.v1"

  # Candidate ORF proteins from MetaCerberus (rule export_metacerberus_orfs).
  orf_proteins: "../results/reporting/metacerberus_orfs.faa"
  # MetaCerberus per-ORF product table (for conserved-domain selection).
  orf_annotation: "../results/annotation/metacerberus/final/annotations-FragGeneScan_metacerberus_input/final_annotation_summary.tsv"

  # Candidate table from rule candidate_contig_table (for host metadata).
  candidates: "../results/reporting/candidate_contigs.tsv"

  # Empty list = all families in results/ictv/families.tsv.
  families: []

  # Single-marker ML phylogeny (task 1).
  marker: "rdrp"
  mafft_strategy: "--auto"
  trimal_strategy: "-autom1"
  iqtree_model: "MFP"
  ufb_replicates: 1000
  alrt_replicates: 1000
  min_ufb: 70
  min_alrt: 90

  # Concatenated conserved-domain phylogeny (task 2, Zowalaty Fig. 5 style).
  # Keys must match safe family names in results/ictv/families.tsv.
  # Values are product keywords matched against MetaCerberus/ICTV annotations.
  domains:
    "Dicistroviridae": ["RNA-dependent RNA polymerase", "replicase", "helicase", "protease", "capsid"]
    "Iflaviridae": ["RNA-dependent RNA polymerase", "replicase", "helicase", "protease", "polyprotein"]
    "Aliusviridae": ["RNA-directed RNA polymerase", "L protein", "nucleoprotein", "glycoprotein"]
    "Chuviridae": ["RNA-directed RNA polymerase", "L protein", "nucleoprotein", "glycoprotein"]
    "Phasmaviridae": ["RNA-dependent RNA polymerase", "L protein", "nucleoprotein", "glycoprotein"]
    "Orthomyxoviridae": ["RNA-directed RNA polymerase", "polymerase", "nucleoprotein", "glycoprotein"]
  concat_placeholder: "XXXXXXXXXX"

  # Diagnostic-residue analysis (task 3, Zhao Fig. 4 style).
  diagnostic_group_column: "group"       # column in taxa_metadata.tsv
  diagnostic_groups: ["candidate", "ICTV"]

  # -----------------------------------------------------------------
  # Genome maps (rules/10.genome_maps.smk, Zowalaty Fig. 3 style)
  # -----------------------------------------------------------------
  genome_maps:
    # per-library coverage statistics from Phase 2 rule contig_coverage_stats
    coverage: "data/03.rnaviralSPAdes/{family}/{sample}/coverage_stats.tsv"
    # ORF products are read from `orf_annotation` above.
    # Colours are assigned by product keyword, first match wins.
    product_colours:
      "RNA-directed RNA polymerase": "#2a78d6"
      "RNA-dependent RNA polymerase": "#2a78d6"
      "replicase": "#2a78d6"
      "nucleoprotein": "#1baf7a"
      "glycoprotein": "#eda100"
      "structural": "#eda100"
      "capsid": "#eda100"
      "polyprotein": "#008300"
      "helicase": "#4a3aa7"
      "protease": "#e34948"
    hypothetical_colour: "#e7e3da"
    max_orf_label: 8             # label at most this many ORFs per contig
    panel_per: "family"          # family | library

  # -----------------------------------------------------------------
  # Recombination screening (rules/11.recombination.smk)
  # -----------------------------------------------------------------
  recombination:
    # Minimum ICTV references per family before screening is attempted;
    # below this, recombination cannot be assessed meaningfully.
    min_references: 8
    # Columns of the trimmed NUCLEOTIDE alignment. Until 2026-11-23 this was
    # compared against an amino-acid length, making the gate ~3x stricter than
    # written: Polycipiviridae (495), Phycodnaviridae (496) and Demerecviridae
    # (475) were each excluded by a few residues.
    min_alignment_nt: 500
    # Minimum non-gap fraction of columns per sequence. A fragmentary contig is
    # mostly gap in a full-genome alignment and the scanners read that as
    # breakpoints, so gap-dominated rows are dropped before screening.
    min_seq_coverage: 0.3
    # Methods actually run. The RDP scan comes from OpenRDP, not the standalone
    # RDP5 binary: that is not on bioconda, rdp5_binary was never supplied, and
    # its rule therefore never ran. OpenRDP's RDP scanner replaces it.
    methods: ["openrdp", "hyphy_gard"]
    openrdp_scanners: ["RDP", "GENECONV", "BootScan", "MaxChi", "Chimaera", "SiScan", "3Seq"]
    openrdp_min_methods: 2       # events called by >= N scanners are reported
    hyphy_method: "gard"         # gard | walrus (if available in the env)
    hyphy_mode: "Faster"
    bootstrap: 100

  # -----------------------------------------------------------------
  # Formal ICTV demarcation tables (rules/12.demarcation.smk)
  # -----------------------------------------------------------------
  demarcation:
    # Thresholds verified against ICTV family reports. Markers are the
    # criterion the family actually uses; `null` means NOT CONFIGURED and the
    # script writes criterion_not_configured rather than inventing a number.
    thresholds:
      "Dicistroviridae": {species_marker: "capsid", species_max_pct: 90, genus_marker: null, genus_max_pct: null, note: "ICTV: capsid polyprotein identity"}
      "Iflaviridae": {species_marker: "capsid", species_max_pct: 90, genus_marker: null, genus_max_pct: null, note: "ICTV: >90% capsid identity within species"}
      "Chuviridae": {species_marker: "L", species_max_pct: 90, genus_marker: "L", genus_max_pct: 31, note: "Di Paola et al. 2022"}
      "Aliusviridae": {species_marker: "L", species_max_pct: 90, genus_marker: "L", genus_max_pct: 31, note: "Di Paola et al. 2022"}
      "Phasmaviridae": {species_marker: "L", species_max_pct: 95, genus_marker: null, genus_max_pct: null, note: "ICTV: <95% L identity"}
      "Orthomyxoviridae": {species_marker: null, species_max_pct: null, genus_marker: null, genus_max_pct: null, note: "genus-specific criteria -- verify before use"}
      "Tombusviridae": {species_marker: null, species_max_pct: null, genus_marker: null, genus_max_pct: null, note: "verify family criterion before use"}

