# configs/phylogenetics.yaml
# Inputs and parameters for rules/09.phylogenetics.smk (Phase 3).
# Paths are relative to the workflow directory unless absolute.

phylogenetics:
# Phase 2 inputs are read from .. (the conifer_pest_virome root, where phase2 runs) -- phase3 is a separate workflow
# with its own working directory, so these are relative to conifer_pest_virome/phase3.
  # ICTV reference proteins, produced from VMR MSL41.v1. Headers carry
  # |<family>| so the prepare script can select exemplars per family.
  # Built by submit_fetch_refs.sh for every family this pathway analyses.
  # The previous ictv_refs.faa held only Chuviridae and Dicistroviridae,
  # hardcoded in the old fetch_refs.py, so almost every family was treed
  # with no references and demarcation had nothing to compare against.
  ictv_proteins: "../references/ictv_refs_all.faa"
  ictv_metadata: "../references/ictv_refs_all_meta.tsv"
  vmr_release: "MSL41.v1"

  # Candidate ORF proteins from MetaCerberus (rule export_metacerberus_orfs).
  orf_proteins: "../results/reporting/metacerberus_orfs.faa"
  # MetaCerberus per-ORF product table (for conserved-domain selection).
  orf_annotation: "../results/annotation/metacerberus/final/annotations-FragGeneScan_metacerberus_input/final_annotation_summary.tsv"

  # Candidate table from rule candidate_contig_table (for host metadata).
  candidates: "../results/reporting/candidate_contigs.tsv"

  # Empty list = all families in results/ictv/families.tsv.
  families: []

  # Single-marker ML phylogeny (task 1).
  marker: "rdrp"
  mafft_strategy: "--auto"
  trimal_strategy: "-automated1"
  iqtree_model: "MFP"
  ufb_replicates: 1000
  alrt_replicates: 1000
  min_ufb: 70
  min_alrt: 90

  # Concatenated conserved-domain phylogeny (task 2, Zowalaty Fig. 5 style).
  # Keys must match safe family names in results/ictv/families.tsv.
  # Values are product keywords matched against MetaCerberus/ICTV annotations.
  domains:
    "Dicistroviridae": ["RNA-dependent RNA polymerase", "replicase", "helicase", "protease", "capsid"]
    "Iflaviridae": ["RNA-dependent RNA polymerase", "replicase", "helicase", "protease", "polyprotein"]
    "Aliusviridae": ["polymerase", "L protein", "nucleoprotein", "glycoprotein"]
    "Chuviridae": ["polymerase", "L protein", "nucleoprotein", "glycoprotein"]
    "Phasmaviridae": ["RNA-dependent RNA polymerase", "L protein", "nucleoprotein", "glycoprotein"]
    "Orthomyxoviridae": ["RNA-directed RNA polymerase", "polymerase", "nucleoprotein", "glycoprotein"]
  concat_placeholder: "XXXXXXXXXX"
  concat_min_taxa: 4

  # Diagnostic-residue analysis (task 3, Zhao Fig. 4 style).
  diagnostic_group_column: "group"       # column in taxa_metadata.tsv
  diagnostic_groups: ["candidate", "ICTV"]

  # -----------------------------------------------------------------
  # Genome maps (rules/10.genome_maps.smk, Zowalaty Fig. 3 style)
  # -----------------------------------------------------------------
  genome_maps:
    # per-library coverage statistics from Phase 2 rule contig_coverage_stats
    coverage: "data/03.rnaviralSPAdes/{family}/{sample}/coverage_stats.tsv"
    # ORF products are read from `orf_annotation` above.
    # Colours are assigned by product keyword, first match wins.
    product_colours:
      "RNA-directed RNA polymerase": "#2a78d6"
      "RNA-dependent RNA polymerase": "#2a78d6"
      "replicase": "#2a78d6"
      "nucleoprotein": "#1baf7a"
      "glycoprotein": "#eda100"
      "structural": "#eda100"
      "capsid": "#eda100"
      "polyprotein": "#008300"
      "helicase": "#4a3aa7"
      "protease": "#e34948"
    hypothetical_colour: "#e7e3da"
    max_orf_label: 8             # label at most this many ORFs per contig
    panel_per: "family"          # family | library

  # -----------------------------------------------------------------
  # Recombination screening (rules/11.recombination.smk)
  # -----------------------------------------------------------------
  recombination:
    # Minimum ICTV references per family before screening is attempted;
    # below this, recombination cannot be assessed meaningfully.
    min_references: 8
    # Cap ICTV references to the top N closest to the candidates so OpenRDP's
    # O(N^3) scanners do not time out at 36h on large families.
    max_references: 25
    # Columns of the trimmed NUCLEOTIDE alignment. Until 2026-11-23 this was
    # compared against an amino-acid length, making the gate ~3x stricter than
    # written: Polycipiviridae (495), Phycodnaviridae (496) and Demerecviridae
    # (475) were each excluded by a few residues.
    min_alignment_nt: 500
    # Minimum non-gap fraction of columns per sequence. A fragmentary contig is
    # mostly gap in a full-genome alignment and the scanners read that as
    # breakpoints, so gap-dominated rows are dropped before screening.
    min_seq_coverage: 0.3
    # Methods actually run. The RDP scan comes from OpenRDP, not the standalone
    # RDP5 binary: that is not on bioconda, rdp5_binary was never supplied, and
    # its rule therefore never ran. OpenRDP's RDP scanner replaces it.
    methods: ["openrdp", "hyphy_gard"]
    # Dropped BootScan and SiScan (cubic window scans that timed out at 36h on 8 families).
    openrdp_scanners: ["RDP", "GENECONV", "MaxChi", "Chimaera", "3Seq"]
    openrdp_min_methods: 2       # events called by >= N scanners are reported
    hyphy_method: "gard"         # gard | walrus (if available in the env)
    hyphy_mode: "Faster"
    bootstrap: 100

  # -----------------------------------------------------------------
  # Formal ICTV demarcation tables (rules/12.demarcation.smk)
  # -----------------------------------------------------------------
  demarcation:
    # Thresholds verified against ICTV family reports. Markers are the
    # criterion the family actually uses; `null` means NOT CONFIGURED and the
    # script writes criterion_not_configured rather than inventing a number.
    # Marker equivalences this project asserts, so a criterion defined on one
    # may be applied to the alignment's marker. ICTV does not state these: the
    # mononegavirus L protein CONTAINS the RdRp domain but is much larger, and
    # identity over the domain is not identity over the whole protein. Rows
    # that used an alias are written with status ok_marker_alias and a note
    # naming the approximation, so they can be filtered out again.
    # Added 2026-11-24 at the user's request, for Chuviridae, Aliusviridae and
    # Phasmaviridae, whose thresholds (Di Paola et al. 2022; ICTV) are on L.
    marker_aliases:
      rdrp: ["L"]
    thresholds:
      # Verified against the current ICTV report chapters, 2026-11-24. A null
      # means the chapter states NO numeric criterion -- the script then writes
      # criterion_not_configured rather than inventing a number. The marker
      # names matter: a criterion defined on capsid, ORF5, full-length L or
      # concatenated core genes cannot be applied to an RdRp alignment, and the
      # script withholds the call with criterion_marker_mismatch when they
      # differ. species_max_pct is the identity ABOVE which two viruses are the
      # same species; below it the candidate is called novel.

      # --- criteria ICTV states on the RdRp, so our alignment can apply them ---
      "Phenuiviridae": {species_marker: "rdrp", species_max_pct: 95, genus_marker: null, genus_max_pct: null, note: "ICTV: viruses in different species have <95% RdRP aa identity. Genus is phylogeny + genome organization + ecology, no number"}
      "Xinmoviridae": {species_marker: "rdrp", species_max_pct: 66, genus_marker: "rdrp", genus_max_pct: 60, note: "ICTV: different species <=66% RdRP aa identity; different genera <=60%"}
      "Partitiviridae": {species_marker: null, species_max_pct: null, genus_marker: "rdrp", genus_max_pct: 24, note: "ICTV: <24% RdRP aa identity between genera. No species criterion is stated in the chapter"}
      "Spinareoviridae": {species_marker: null, species_max_pct: null, genus_marker: "rdrp", genus_max_pct: 26, note: "ICTV: different genera usually <26% RdRP aa identity, within a genus usually >30%. Stated as usually, with named exceptions (mycoreovirus ~29% vs Coltivirus; aquareo/orthoreo up to 42%). Species criteria are qualitative only"}

      # --- criteria exist but on a marker this alignment does not measure ---
      "Dicistroviridae": {species_marker: "capsid", species_max_pct: 90, genus_marker: null, genus_max_pct: null, note: "ICTV: >90% capsid aa identity within a species, plus host range and serology. Capsid, not RdRp -- call withheld on an RdRp alignment"}
      "Iflaviridae": {species_marker: "capsid", species_max_pct: 90, genus_marker: null, genus_max_pct: null, note: "ICTV: >90% capsid aa identity within a species. Capsid, not RdRp -- call withheld on an RdRp alignment"}
      "Chuviridae": {species_marker: "L", species_max_pct: 90, genus_marker: "L", genus_max_pct: 31, note: "Di Paola et al. 2022, on full-length L. Not the ICTV chapter, and L is not the RdRp domain this alignment measures"}
      "Aliusviridae": {species_marker: "L", species_max_pct: 90, genus_marker: "L", genus_max_pct: 31, note: "Di Paola et al. 2022, on full-length L. Not the ICTV chapter, and L is not the RdRp domain this alignment measures"}
      "Phasmaviridae": {species_marker: "L", species_max_pct: 95, genus_marker: null, genus_max_pct: null, note: "ICTV: <95% L identity between species. Full-length L, not the RdRp domain"}
      "Baculoviridae": {species_marker: "lef-8+lef-9+polh nt K2P", species_max_pct: null, genus_marker: null, genus_max_pct: null, note: "ICTV Alpha/Betabaculovirus: Kimura-2-parameter nt distance on partial lef-8, lef-9 and polh/gran -- <0.015 subs/site same species, >0.05 different, 0.015-0.05 needs host range. A distance on three core genes, not an RdRp identity, so it cannot be expressed here. Gamma/Deltabaculovirus have no numeric criterion"}
      "Polycipiviridae": {species_marker: null, species_max_pct: null, genus_marker: null, genus_max_pct: null, note: "ICTV genus pages: formal species criteria not established. The >90% ORF5 aa identity figure on those pages is descriptive, not a demarcation threshold, and ORF5 is not the RdRp"}

      # --- chapters that state no numeric criterion at all ---
      "Nyamiviridae": {species_marker: null, species_max_pct: null, genus_marker: null, genus_max_pct: null, note: "ICTV: no firm genus criteria beyond phylogeny and host; no species criteria stated"}
      "Rhabdoviridae": {species_marker: null, species_max_pct: null, genus_marker: null, genus_max_pct: null, note: "ICTV: genera by L phylogeny, genome architecture, antigenicity and ecology; no numeric threshold, no species criteria stated"}
      "Solemoviridae": {species_marker: null, species_max_pct: null, genus_marker: null, genus_max_pct: null, note: "ICTV: genera differentiated by phylogenies of individual ORFs or proteins; no number, no species criteria stated"}
      "Flaviviridae": {species_marker: null, species_max_pct: null, genus_marker: null, genus_max_pct: null, note: "No family-wide criterion: ICTV states these per genus. Hepacivirus >0.25 aa p-distance in conserved NS3 (and >0.3 in NS5B); Pegivirus >0.31 in NS3; Orthoflavivirus is multi-factor with no number. Per-genus NS3/NS5B criteria cannot be applied to a family-level RdRp alignment"}
      "Hepeviridae": {species_marker: null, species_max_pct: null, genus_marker: null, genus_max_pct: null, note: "ICTV chapter gives no species or genus criterion. Its only numeric statement is at subfamily level: inter-subfamily ORF1 aa p-distance >0.6 vs intra-subfamily <0.5"}
      "Orthomyxoviridae": {species_marker: null, species_max_pct: null, genus_marker: null, genus_max_pct: null, note: "No chapter in the current ICTV report index (checked 2026-11-24); criteria are genus-specific. Verify before use"}
      "Tombusviridae": {species_marker: null, species_max_pct: null, genus_marker: null, genus_max_pct: null, note: "No chapter in the current ICTV report index (checked 2026-11-24). Verify before use"}

      # --- ranks above family: ICTV publishes no criterion here ---
      "Amarillovirales": {species_marker: null, species_max_pct: null, genus_marker: null, genus_max_pct: null, note: "An order, not a family. No criterion exists at this rank; see Flaviviridae, whose criteria are per genus"}
      "Tolivirales": {species_marker: null, species_max_pct: null, genus_marker: null, genus_max_pct: null, note: "An order, not a family. No criterion at this rank"}
      "Duplopiviricetes": {species_marker: null, species_max_pct: null, genus_marker: null, genus_max_pct: null, note: "A class, not a family. No criterion at this rank"}
      "Duplornaviricota": {species_marker: null, species_max_pct: null, genus_marker: null, genus_max_pct: null, note: "A phylum, not a family. No criterion at this rank"}
      "Reoviridae": {species_marker: null, species_max_pct: null, genus_marker: null, genus_max_pct: null, note: "Legacy name: split into Sedoreoviridae and Spinareoviridae in 2022. Use those entries; contigs binned here should be re-assigned"}

